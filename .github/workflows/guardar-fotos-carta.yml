name: Guardar fotos de carta en el repositorio
on:
  push:
    paths:
      - '.github/workflows/guardar-fotos-carta.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guardar-fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar y comprobar las 13 fotos nuevas
        run: |
          python3 - <<'PY'
          import json, pathlib, re, urllib.request, time
          html_path = pathlib.Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          match = re.search(r'const MENU=(\[.*?\]);\n', html, re.S)
          assert match, 'No se encontró el catálogo'
          items = json.loads(match.group(1))
          assert len(items)==26, 'Número de platos incorrecto'
          out = pathlib.Path('assets/menu')
          out.mkdir(parents=True,exist_ok=True)
          number=0
          for p in items:
              url = p.get('image') or ''
              if not url.startswith('https://images.pexels.com/'):
                  continue
              err=None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; menu-restaurante/1.0)'})
                      with urllib.request.urlopen(req,timeout=35) as response:
                          data=response.read()
                      if not data.startswith(b'\xff\xd8\xff') or len(data)<4000:
                          raise ValueError('Imagen JPG incorrecta o vacía')
                      break
                  except Exception as ex:
                      err=ex
                      print('Reintento',p['id'],str(ex))
                      time.sleep(3)
              else:
                  raise RuntimeError(f"Foto {p['id']}: {err}")
              path=out/(p['id']+'.jpg')
              path.write_bytes(data)
              p['image']=path.as_posix()
              number+=1
              print('OK',p['id'],len(data),'bytes')
          assert number==13,f'Esperadas 13 fotos, se descargaron {number}'
          updated=html[:match.start(1)] + json.dumps(items,ensure_ascii=False,separators=(',',':')) + html[match.end(1):]
          assert 'Imagen ilustrativa</span>' not in updated
          assert all(p.get('image') for p in items)
          html_path.write_text(updated,encoding='utf-8')
          PY
      - name: Confirmar imágenes y actualizar la carta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/menu
          git diff --cached --quiet || (git commit -m "Guardar las 13 fotos localmente para que no dependan de enlaces externos" && git push)
