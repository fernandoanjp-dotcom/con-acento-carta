<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Con Acento · Nuestra carta</title><meta name="description" content="Descubre los platos de Con Acento en nuestra carta digital.">
<style>

:root{--wine:#54293b;--rose:#9b5f70;--cream:#fff9f2;--line:#ecdcd0;--ink:#32282a;--muted:#786c6c;--gold:#b78352}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:#fffaf5;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #cc9063;outline-offset:3px}
[hidden]{display:none!important}
.display{min-height:100vh;background:#fffaf5}
.hero{color:white;position:relative;overflow:hidden;background:linear-gradient(115deg,#5b293d,#915968);padding:38px max(20px,calc((100vw - 1100px)/2))}
.hero:after{content:'✺';position:absolute;font-size:200px;opacity:.08;right:4%;top:-78px;pointer-events:none}
.hero h1{font:500 clamp(43px,6vw,67px)/1.1 Georgia,serif;letter-spacing:-.035em;margin:0;position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.con-logo{display:inline-grid;place-items:center;border:2px solid #f8e4da;border-radius:50%;width:66px;height:66px;flex:0 0 66px;font:italic 49px Georgia,serif}
.menu-content{max-width:1140px;margin:0 auto;padding:0 20px 70px}
.toolbar{padding:24px 3px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.subtitle{font:500 clamp(26px,3vw,35px)/1.2 Georgia,serif;color:var(--wine);margin:0}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tools button,.tools select{background:#fff6ee;border:1px solid #dfc6bd;color:var(--wine);border-radius:24px;padding:10px 15px;font-size:13px;font-weight:750;min-height:41px}
.tools button[aria-pressed="true"]{background:var(--wine);color:white}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:22px}
.dish{display:flex;flex-direction:column;background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.photo{width:100%;height:250px;overflow:hidden;background:#e8d7d0}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.dishbody{padding:20px;flex:1;display:flex;flex-direction:column;min-width:0;gap:13px}
.dishhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dish h3{font:500 clamp(20px,2vw,25px)/1.23 Georgia,serif;color:var(--wine);margin:0;overflow-wrap:break-word}
.price{font-size:16px;font-weight:800;white-space:nowrap}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{border:0;border-radius:8px;background:var(--wine);color:white;padding:10px 13px;font-size:12px;line-height:1.35;font-weight:750;max-width:100%}
.btn.outline{color:var(--wine);background:#fff8f0;border:1px solid #d8bfb8}
.integrated{border-top:1px solid var(--line);padding-top:11px;display:flex;flex-direction:column;gap:9px}
.integrated p{font-size:13px;line-height:1.55;color:#574e4d;margin:0}
.integrated button{align-self:flex-start}
.items.list{grid-template-columns:1fr;gap:14px}
.items.list .dish{flex-direction:row}
.items.list .photo{width:205px;height:auto;min-height:165px;flex:0 0 205px}
.items.list .dishbody{padding:17px 21px}
.items.list .dish h3{font-size:22px}
.modal{max-width:540px;border:0;border-radius:16px;padding:24px;box-shadow:0 30px 100px #24131566;width:calc(100% - 28px)}
.modal::backdrop{background:#20141b9c}
.modal h2{font:500 29px Georgia,serif;color:var(--wine)}
.modal p{line-height:1.65;font-size:14px;color:#55494c}
.modal .btn{margin-top:14px}
.premium .hero{background:radial-gradient(circle at 90% 70%,#a36a5b75,transparent 40%),linear-gradient(115deg,#1d1720,#572735);padding-top:49px;padding-bottom:49px}
.premium .dish{border-radius:19px;box-shadow:0 9px 25px #4c27240f}
.premium .photo{height:275px}
.premium .items.list .photo{height:auto}
.premium .toolbar{border-bottom-color:#c9aa94}
.premium .subtitle{letter-spacing:.01em}
@media(max-width:700px){
 .hero{padding:29px 20px}
 .hero h1{font-size:43px;gap:10px}
 .con-logo{width:48px;height:48px;flex-basis:48px;font-size:35px}
 .menu-content{padding:0 13px 42px}
 .toolbar{padding:18px 2px 15px;gap:10px}
 .subtitle{font-size:27px}
 .tools{gap:5px}
 .tools button,.tools select{min-height:37px;padding:8px 10px;font-size:12px}
 .items{grid-template-columns:1fr;margin-top:13px;gap:13px}
 .photo,.premium .photo{height:230px}
 .dishbody{padding:15px;gap:11px}
 .dish h3{font-size:22px}
 .items.list .dish{flex-direction:row;min-height:118px}
 .items.list .photo,.premium .items.list .photo{width:112px;flex:0 0 112px;height:auto;min-height:118px}
 .items.list .dishbody{padding:11px 10px;gap:7px}
 .items.list .dish h3{font-size:17px;line-height:1.16}
 .items.list .price{font-size:12px}
 .items.list .dishhead{gap:6px}
 .items.list .integrated{padding-top:7px;gap:6px}
 .items.list .integrated p{font-size:11px;line-height:1.3}
 .items.list .integrated .btn{font-size:10px;padding:7px 8px}
 .items.list .actionrow .btn{font-size:10px;padding:7px 8px}
 .premium .hero{padding-top:33px;padding-bottom:33px}
}
@media(max-width:370px){
 .hero h1{font-size:36px}
 .items.list .photo,.premium .items.list .photo{width:94px;flex-basis:94px}
 .items.list .dish h3{font-size:15px}
 .items.list .dishhead{flex-wrap:wrap}
}

</style></head>
<body>
<main id="screen" class="display">
  <header class="hero">
    <h1><span class="con-logo" aria-hidden="true">C</span> Con Acento</h1>
  </header>
  <div class="menu-content">
    <div class="toolbar">
      <h2 class="subtitle">Nuestra carta</h2>
      <div class="tools">
        <select id="language" aria-label="Idioma de la carta" hidden></select>
        <div id="view-controls" class="tools" hidden>
          <button id="grid-button" type="button" aria-pressed="true">▦ Cuadrícula</button>
          <button id="list-button" type="button" aria-pressed="false">☷ Lista</button>
        </div>
      </div>
    </div>
    <section class="items" id="items" aria-label="Platos de la carta"></section>
  </div>
</main>
<dialog class="modal" id="details">
  <h2 id="modal-title"></h2>
  <p id="modal-description"></p>
  <div class="actionrow">
    <button id="modal-audio" class="btn" type="button" hidden>▶ Escuchar</button>
    <button id="modal-close" class="btn outline" type="button">Cerrar ficha</button>
  </div>
</dialog>
<script>
(function(){
'use strict';
var $=function(x){return document.getElementById(x)},params=new URLSearchParams(location.search),plan=['basica','plata','oro'].includes(params.get('p'))?params.get('p'):'basica';
var opt={p:plan,d:params.get('d')==='1',a:params.get('a')==='1',v:params.get('v')==='1',q:params.get('q')==='1',c:params.get('c')==='1'&&params.get('q')==='1',l:bound('l',5)};
var view='grid',language='es',current=null;
var languages=[['es','Español'],['en','English'],['fr','Français'],['it','Italiano'],['de','Deutsch'],['pt','Português']];
var dishes=[
 {image:'https://conacento.onrender.com/assets/1.jpg',price:4.5,t:{
 es:['Salmón a la plancha sobre tosta de Tres Rosales','Con guacamole y salsa de chile dulce-picante.'],
 en:['Grilled salmon on Tres Rosales toast','With guacamole and a sweet and spicy chilli sauce.'],
 fr:['Saumon grillé sur toast Tres Rosales','Avec du guacamole et une sauce au piment aigre-douce.'],
 it:['Salmone grigliato su toast Tres Rosales','Con guacamole e salsa al peperoncino agrodolce.'],
 de:['Gegrillter Lachs auf Tres-Rosales-Toast','Mit Guacamole und süß-scharfer Chilisauce.'],
 pt:['Salmão grelhado sobre tosta Tres Rosales','Com guacamole e molho de malagueta agridoce.']}},
 {image:'https://conacento.onrender.com/assets/2.jpg',price:5,t:{
 es:['Lingote de costilla deshuesada','Con crema de setas, cebolla caramelizada y pimiento de Padrón.'],
 en:['Boneless rib meat','With mushroom cream, caramelised onion and Padrón pepper.'],
 fr:['Viande de côte désossée','Avec crème de champignons, oignon caramélisé et piment de Padrón.'],
 it:['Costina disossata','Con crema di funghi, cipolla caramellata e peperone di Padrón.'],
 de:['Entbeintes Rippe','Mit Pilzcreme, karamellisierten Zwiebeln und Padrón-Paprika.'],
 pt:['Costela desossada','Com creme de cogumelos, cebola caramelizada e pimento de Padrón.']}},
 {image:'https://conacento.onrender.com/assets/6.jpg',price:4,t:{
 es:['Espinacas con nueces y beicon','Con crema de queso de cabra.'],
 en:['Spinach with walnuts and bacon','With goat cheese cream.'],
 fr:['Épinards aux noix et au bacon','Avec crème de fromage de chèvre.'],
 it:['Spinaci con noci e bacon','Con crema di formaggio di capra.'],
 de:['Spinat mit Walnüssen und Speck','Mit Ziegenkäsecreme.'],
 pt:['Espinafres com nozes e bacon','Com creme de queijo de cabra.']}}
];
function bound(k,max){var n=Number(params.get(k));return Number.isFinite(n)?Math.max(0,Math.min(max,Math.floor(n))):0}
function euro(n){return n.toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2})+' €'}
function node(el,className,text){var x=document.createElement(el);if(className)x.className=className;if(text!==undefined)x.textContent=text;return x}
function btn(txt,fn,variant){var b=node('button','btn'+(variant?' outline':''),txt);b.type='button';b.addEventListener('click',fn);return b}
function speak(item){if(!opt.a)return;if(!('speechSynthesis' in window)){alert('Tu navegador no permite reproducir esta narración.');return}window.speechSynthesis.cancel();var v=item.t[language]||item.t.es;var u=new SpeechSynthesisUtterance(v[0]+'. '+v[1]);u.lang={es:'es-ES',en:'en-GB',fr:'fr-FR',it:'it-IT',de:'de-DE',pt:'pt-PT'}[language];u.rate=.9;window.speechSynthesis.speak(u)}
function openDetail(item){current=item;var t=item.t[language]||item.t.es;$('modal-title').textContent=t[0]+' · '+euro(item.price);$('modal-description').textContent=t[1];$('modal-audio').hidden=!opt.a;$('details').showModal()}
function render(){var integrated=opt.d&&opt.a&&opt.v&&view==='list';$('items').className='items'+(view==='list'?' list':'');$('grid-button').setAttribute('aria-pressed',String(view==='grid'));$('list-button').setAttribute('aria-pressed',String(view==='list'));$('items').replaceChildren();dishes.forEach(function(it){var t=it.t[language]||it.t.es;var card=node('article','dish'),photo=node('div','photo'),body=node('div','dishbody'),head=node('div','dishhead'),title=node('h3','',t[0]),cost=node('strong','price',euro(it.price));var img=node('img','');img.src=it.image;img.alt='Fotografía de '+t[0];img.loading='lazy';photo.append(img);head.append(title,cost);body.append(head);if(integrated){var info=node('div','integrated');info.append(node('p','',t[1]),btn('▶ Escuchar descripción',function(){speak(it)}));body.append(info)}else{var actions=node('div','actionrow');if(opt.d)actions.append(btn('Ver detalles del plato',function(){openDetail(it)}));if(opt.a&&!opt.d)actions.append(btn('▶ Escuchar',function(){speak(it)},true));body.append(actions)}card.append(photo,body);$('items').append(card)})}
if(opt.p==='oro')$('screen').classList.add('premium');
$('view-controls').hidden=!opt.v;if(opt.v){$('grid-button').addEventListener('click',function(){view='grid';render()});$('list-button').addEventListener('click',function(){view='list';render()})}
if(opt.l){$('language').hidden=false;languages.slice(0,opt.l+1).forEach(function(v){var el=node('option','',v[1]);el.value=v[0];$('language').append(el)});$('language').addEventListener('change',function(){language=$('language').value;render()})}
$('modal-close').addEventListener('click',function(){$('details').close()});$('modal-audio').addEventListener('click',function(){if(current)speak(current)});$('details').addEventListener('close',function(){if('speechSynthesis' in window)window.speechSynthesis.cancel()});
render();

})();
</script></body></html>
